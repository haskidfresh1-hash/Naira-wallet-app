<div class="app">

  <div class="top-bar">
    <h2>Hi, User 👋</h2>
  </div>

  <div class="balance-card">
    <p>Wallet Balance</p>
    <h1 id="balance">₦0.00</h1>
  </div>

  <div class="actions">
    <button onclick="deposit()">📥 Fund</button>
    <button onclick="withdraw()">📤 Withdraw</button>
    <button onclick="send()">🔁 Transfer</button>
  </div>

  <div class="input-box">
    <input id="amount" placeholder="Enter amount">
    <input id="user" placeholder="Send to (username)">
    <input id="sendAmount" placeholder="Transfer amount">
  </div>

  <div class="history">
    <h3>Recent Activity</h3>
    <ul id="list"></ul>
  </div>

</div>
